name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: xu-cheng/latex-action@v4
        with:
          root_file: yen-chieh-huang.tex
          latexmk_use_xelatex: true

      - name: Render preview images
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftoppm -png -r 150 yen-chieh-huang.pdf preview

      - name: Push to pdf branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan pdf

          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "Auto-generated by [\`build.yml\`](${repo_url}/blob/main/.github/workflows/build.yml) from [\`main\`](${repo_url}/tree/main) @ [\`${GITHUB_SHA::7}\`](${repo_url}/commit/${GITHUB_SHA}) on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "📄 **[yen-chieh-huang.pdf](yen-chieh-huang.pdf)**"
            echo
            for f in preview-*.png; do
              n="${f#preview-}"
              n="${n%.png}"
              echo "<img src=\"${f}\" alt=\"Page ${n#0}\" width=\"100%\">"
              echo
            done
          } > README.md

          git add yen-chieh-huang.pdf preview-*.png README.md
          git commit -m "build from ${GITHUB_SHA::7}"
          git push -f origin pdf
